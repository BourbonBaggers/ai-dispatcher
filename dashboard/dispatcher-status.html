<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatcher Status</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #657286;
      --line: #d8e0e8;
      --accent: #176b87;
      --active: #1f7a4d;
      --attention: #b45309;
      --offline: #8a1f1f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 18px; }
    h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.15; letter-spacing: 0; }
    h2 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .subtle { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
    .tab {
      min-width: 170px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: #eef3f7;
      color: var(--ink);
      padding: 10px 14px;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--panel); color: var(--accent); font-weight: 700; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; box-shadow: 0 8px 20px rgba(23, 32, 42, 0.06); }
    .status-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 18px; align-items: start; }
    .headline { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: #f8fafc; }
    .badge.active { color: var(--active); border-color: #b9d8ca; background: #edf8f2; }
    .badge.idle { color: var(--accent); border-color: #b8d6df; background: #ecf7fa; }
    .badge.attention { color: var(--attention); border-color: #f0c68e; background: #fff7ed; }
    .badge.offline { color: var(--offline); border-color: #e5aaaa; background: #fff0f0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .field { border-top: 1px solid var(--line); padding-top: 9px; min-width: 0; }
    .label { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .value { font-size: 14px; overflow-wrap: anywhere; }
    a { color: var(--accent); text-decoration-thickness: 1px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .side { border-left: 1px solid var(--line); padding-left: 18px; }
    .next { font-size: 28px; line-height: 1.1; font-weight: 800; margin: 6px 0 4px; }
    .section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .run-list { display: grid; gap: 8px; margin-top: 10px; }
    .run-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fbfcfd;
    }
    .run-title { font-weight: 700; overflow-wrap: anywhere; }
    .run-meta { margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    details { margin-top: 18px; border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; overflow: hidden; }
    summary { cursor: pointer; padding: 12px 14px; font-weight: 700; user-select: none; }
    pre {
      margin: 0;
      padding: 14px;
      min-height: 180px;
      max-height: 460px;
      overflow: auto;
      background: #0f1720;
      color: #dce7f3;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .empty { border: 1px dashed var(--line); border-radius: 6px; padding: 18px; color: var(--muted); background: var(--panel); }
    body.compact { background: var(--panel); }
    body.compact main { width: 100%; padding: 12px; }
    body.compact header { margin-bottom: 10px; }
    body.compact h1 { font-size: 17px; }
    body.compact h2 { font-size: 15px; }
    body.compact #clock,
    body.compact .tabs,
    body.compact .side,
    body.compact .desktop-only { display: none; }
    body.compact .panel { border: 0; border-radius: 0; padding: 0; box-shadow: none; }
    body.compact .status-row,
    body.compact .grid { display: block; }
    body.compact .field { padding: 8px 0; }
    body.compact .run-item { grid-template-columns: minmax(0, 1fr); }
    body.compact details { display: none; }
    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .status-row, .grid { grid-template-columns: 1fr; }
      .side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Dispatcher Status</h1>
        <div class="subtle" id="updated">Loading dev server state...</div>
      </div>
      <div class="subtle" id="clock"></div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Dispatcher instances"></nav>
    <section id="content" class="panel"><div class="empty">Loading...</div></section>
  </main>
  <script>
    const REFRESH_MS = 15000;
    const compact = location.pathname === "/compact" || new URLSearchParams(location.search).get("view") === "compact";
    const state = { payload: null, selected: null, streams: new Map() };
    const tabs = document.getElementById("tabs");
    const content = document.getElementById("content");
    const updated = document.getElementById("updated");
    const clock = document.getElementById("clock");
    if (compact) document.body.classList.add("compact");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function fmtTime(ms) {
      return ms ? new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "n/a";
    }
    function fmtDateTime(ms) {
      return ms ? new Date(ms).toLocaleString([], { dateStyle: "medium", timeStyle: "medium" }) : "n/a";
    }
    function duration(ms) {
      if (ms == null) return "n/a";
      const s = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m ${r}s`;
      return `${r}s`;
    }
    function countdown(target) {
      if (!target) return "n/a";
      return duration(Math.max(0, target - Date.now()));
    }
    function instanceTitle(instance) {
      return instance.repo.replace("BourbonBaggers/", "") || instance.unit;
    }
    function currentIssue(instance) {
      const current = instance.status.current;
      if (current) return current.issue;
      if (instance.status.github.state === "ok" && instance.status.github.workingIssues.length) return instance.status.github.workingIssues[0];
      return null;
    }
    function field(label, value) {
      return `<div class="field"><div class="label">${escapeHtml(label)}</div><div class="value">${value}</div></div>`;
    }
    function renderRecentRuns(instance) {
      const runs = instance.recentRuns ?? [];
      if (!runs.length) {
        return '<div class="section"><h2>Recent Runs</h2><div class="empty" style="margin-top:10px">No non-idle runs recorded.</div></div>';
      }
      const items = runs.map((run) => {
        const issue = run.issue;
        const issueText = `<a href="${escapeHtml(issue.url)}" target="_blank" rel="noreferrer">#${escapeHtml(issue.number)} ${escapeHtml(issue.title)}</a>`;
        const prText = run.pr ? ` · PR #${escapeHtml(run.pr.number)}` : "";
        const summary = run.failureSummary ? ` · ${escapeHtml(run.failureSummary)}` : "";
        return `
          <div class="run-item">
            <div>
              <div class="run-title">${issueText}</div>
              <div class="run-meta">${escapeHtml(run.phase)} · ${escapeHtml(run.agent)} · ${fmtDateTime(run.timestamps.startedAt)} · ${duration(run.timestamps.durationMs)}${prText}${summary}</div>
            </div>
            <span class="badge ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>
          </div>
        `;
      }).join("");
      return `<div class="section"><h2>Recent Runs</h2><div class="run-list">${items}</div></div>`;
    }
    function renderTabs() {
      tabs.innerHTML = "";
      if (compact) return;
      for (const instance of state.payload?.instances ?? []) {
        const button = document.createElement("button");
        button.className = "tab";
        button.type = "button";
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", String(instance.unit === state.selected));
        button.innerHTML = `${escapeHtml(instanceTitle(instance))}<br><span class="subtle">${escapeHtml(instance.kind)}</span>`;
        button.onclick = () => { state.selected = instance.unit; render(); };
        tabs.appendChild(button);
      }
    }
    function renderInstance(instance) {
      const current = instance.status.current;
      const issue = currentIssue(instance);
      const pr = current?.pr;
      const gitWarning = instance.status.github.state === "unavailable"
        ? instance.status.github.warning
        : instance.status.github.state === "ok" && current && !instance.status.github.workingIssues.some((candidate) => candidate.number === current.issue.number)
          ? "agent-working label is absent on the current issue"
          : null;
      const issueValue = issue ? `<a href="${escapeHtml(issue.url)}" target="_blank" rel="noreferrer">#${escapeHtml(issue.number)} ${escapeHtml(issue.title)}</a>` : "none";
      const prValue = pr ? `<a href="${escapeHtml(pr.url)}" target="_blank" rel="noreferrer">#${escapeHtml(pr.number)}</a>` : "none";
      const nextValue = instance.nextRunAt
        ? `${fmtDateTime(instance.nextRunAt)} · in <span data-countdown="${instance.nextRunAt}">${countdown(instance.nextRunAt)}</span>`
        : (instance.kind === "idle" ? "unknown" : "after current work settles");
      const liveId = `stream-${instance.unit.replace(/[^a-z0-9_-]/gi, "-")}`;
      content.innerHTML = `
        <div class="status-row">
          <div>
            <div class="headline">
              <h2>${escapeHtml(instance.description)}</h2>
              <span class="badge ${escapeHtml(instance.kind)}">${escapeHtml(instance.kind)}</span>
            </div>
            <div class="grid">
              ${field("Repository", escapeHtml(instance.repo))}
              ${field("Systemd", `${escapeHtml(instance.systemd.activeState)} / ${escapeHtml(instance.systemd.subState)}${instance.systemd.mainPid ? `, pid ${instance.systemd.mainPid}` : ""}`)}
              ${field("Phase", escapeHtml(current?.phase ?? (instance.kind === "idle" ? "idle" : instance.kind)))}
              ${field("Status", escapeHtml(current?.status ?? instance.kind))}
              ${field("Issue", issueValue)}
              ${field("Pull Request", prValue)}
              <div class="desktop-only">${field("Agent", current ? escapeHtml(`${current.agent} (${current.cliModel}, effort ${current.cliEffort})`) : "none")}</div>
              <div class="desktop-only">${field("Branch", escapeHtml(current?.branch ?? "none"))}</div>
              ${field("Last scan", instance.recentScan ? `${fmtDateTime(instance.recentScan.at)} · ${escapeHtml(instance.recentScan.message)}` : "unknown")}
              ${field("Next run", nextValue)}
              <div class="desktop-only">${field("Inspect", current?.ghCommand ? `<code>${escapeHtml(current.ghCommand)}</code>` : "none")}</div>
              ${field("GitHub signal", gitWarning ? escapeHtml(gitWarning) : escapeHtml(instance.status.github.state))}
            </div>
          </div>
          <aside class="side">
            <div class="label">Next Run</div>
            <div class="next">${instance.nextRunAt ? countdown(instance.nextRunAt) : "n/a"}</div>
            <div class="subtle">${instance.nextRunAt ? fmtDateTime(instance.nextRunAt) : "Shown when the instance is idle."}</div>
            <div style="height:16px"></div>
            <div class="label">State Dir</div>
            <div class="value">${escapeHtml(instance.stateDir)}</div>
          </aside>
        </div>
        ${renderRecentRuns(instance)}
        <details data-unit="${escapeHtml(instance.unit)}">
          <summary>Live stream</summary>
          <pre id="${liveId}">Stream opens on demand. Waiting for output...</pre>
        </details>
      `;
      const details = content.querySelector("details");
      details.addEventListener("toggle", () => {
        if (details.open) startStream(instance.unit, liveId);
        else stopStream(instance.unit);
      });
    }
    function render() {
      const instances = state.payload?.instances ?? [];
      if (!instances.length) {
        tabs.innerHTML = "";
        content.innerHTML = '<div class="empty">No dispatcher instances discovered.</div>';
        return;
      }
      if (!state.selected || !instances.some((instance) => instance.unit === state.selected)) state.selected = instances[0].unit;
      renderTabs();
      renderInstance(instances.find((instance) => instance.unit === state.selected));
    }
    async function refresh() {
      const response = await fetch("/api/instances", { cache: "no-store" });
      state.payload = await response.json();
      updated.textContent = `Updated ${fmtDateTime(state.payload.updatedAt)}`;
      render();
    }
    function startStream(unit, preId) {
      stopStream(unit);
      const pre = document.getElementById(preId);
      const source = new EventSource(`/api/stream?unit=${encodeURIComponent(unit)}`);
      state.streams.set(unit, source);
      source.addEventListener("entry", (event) => {
        const entry = JSON.parse(event.data);
        const line = entry.type === "output"
          ? entry.line
          : entry.type === "phase"
            ? `[phase:${entry.phase}] ${entry.message}`
            : `[${entry.status}] ${entry.message ?? ""}`;
        pre.textContent += `\n${line}`;
        pre.scrollTop = pre.scrollHeight;
      });
      source.onerror = () => { pre.textContent += "\n[stream] reconnecting..."; };
    }
    function stopStream(unit) {
      const existing = state.streams.get(unit);
      if (existing) existing.close();
      state.streams.delete(unit);
    }
    setInterval(() => {
      clock.textContent = fmtTime(Date.now());
      document.querySelectorAll("[data-countdown]").forEach((node) => {
        node.textContent = countdown(Number(node.dataset.countdown));
      });
    }, 1000);
    refresh().catch((error) => {
      content.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
    });
    setInterval(() => refresh().catch(() => {}), REFRESH_MS);
  </script>
</body>
</html>
