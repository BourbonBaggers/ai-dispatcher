name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This service has zero runtime dependencies: Node 24 strips its TypeScript natively
  # and it tests with node:test. Its only devDependency is typescript. Nothing here may
  # import from the internal-tools monorepo — see AGENTS.md.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Shellcheck the bundled launch scripts
        run: |
          install_start="$(date +%s)"
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          install_end="$(date +%s)"
          echo "[shellcheck-ci] Installation duration: $((install_end - install_start))s"
          bash scripts/shellcheck-ci.sh

  # Guard the extraction. The dispatcher was split out of BourbonBaggers/internal-tools;
  # re-introducing a dependency on that monorepo would silently un-do the separation and
  # break a clean clone. Fail the build if source or manifests reference it.
  no-monorepo-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject imports or paths reaching into internal-tools
        run: |
          if grep -rnE "@internal/|\.\./\.\./(packages|apps)/|services/ai-dispatcher" \
               --include='*.ts' --include='*.mjs' --include='*.json' \
               src bin test package.json 2>/dev/null; then
            echo "::error::This service must not depend on the internal-tools monorepo."
            exit 1
          fi
          echo "No monorepo coupling found."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
