name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This service has zero runtime dependencies: Node 24 strips its TypeScript natively
  # and it tests with node:test. Its only devDependency is typescript.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Reject public release hygiene regressions
        run: bash scripts/check-public-release-hygiene.sh
      - name: Shellcheck the bundled launch scripts
        run: |
          install_start="$(date +%s)"
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          install_end="$(date +%s)"
          echo "[shellcheck-ci] Installation duration: $((install_end - install_start))s"
          bash scripts/shellcheck-ci.sh

  # Guard the standalone boundary. Fail the build if source or manifests reach outside
  # the repository's own runtime and package boundaries.
    no-private-coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject imports or paths reaching outside this repository
        run: |
          if grep -rnE "@internal/|\.\./\.\./(packages|apps)/|services/ai-dispatcher" \
               --include='*.ts' --include='*.mjs' --include='*.json' \
               src bin test package.json 2>/dev/null; then
            echo "::error::This service must not depend on private repository paths."
            exit 1
          fi
          echo "No private coupling found."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
